<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#417505">

  <meta name="description"
        content="Top Market — Digital Business Card">

  <title>Top Market — Digital Card</title>


  <style>

    :root {
      --green: #417505;
      --green-dark: #2f5603;
      --green-light: #edf4e7;

      --black: #171a16;
      --gray: #777b74;
      --line: #e9ede6;

      --white: #ffffff;
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      min-height: 100vh;

      font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at 50% -10%,
          #e8f0e2 0,
          #f8faf7 34%,
          #ffffff 68%
        );

      color: var(--black);

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 22px 14px;

    }


    /* MAIN CARD */

    .card {

      width: 100%;

      max-width: 455px;

      background: rgba(255,255,255,.96);

      border: 1px solid rgba(65,117,5,.11);

      border-radius: 34px;

      position: relative;

      overflow: hidden;

      padding:
        32px 25px 28px;

      box-shadow:

        0 35px 90px rgba(25,45,20,.11),

        0 8px 25px rgba(65,117,5,.05);

      animation:
        cardEntrance .75s cubic-bezier(.2,.8,.2,1);

    }


    @keyframes cardEntrance {

      from {

        opacity: 0;

        transform:
          translateY(30px)
          scale(.97);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* LANGUAGE SWITCHER */

    .language-switcher {

      position: relative;

      z-index: 10;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 5px;

      margin-bottom: 18px;

      direction: ltr;

    }


    .lang-btn {

      border: 1px solid rgba(65,117,5,.13);

      background: #f7f9f5;

      color: #70756d;

      border-radius: 10px;

      padding: 7px 11px;

      font-family: inherit;

      font-size: 11px;

      font-weight: 700;

      cursor: pointer;

      transition:
        all .25s ease;

    }


    .lang-btn:hover {

      border-color:
        rgba(65,117,5,.3);

      color:
        var(--green);

      transform:
        translateY(-1px);

    }


    .lang-btn.active {

      background:
        var(--green);

      color:
        white;

      border-color:
        var(--green);

      box-shadow:
        0 5px 13px
        rgba(65,117,5,.18);

    }


    /* TOP ACCENT */

    .accent {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 4px;

      background:

        linear-gradient(
          90deg,
          var(--green-dark),
          var(--green),
          #779d4b,
          var(--green),
          var(--green-dark)
        );

    }


    /* DECORATIVE CIRCLES */

    .decor {

      position: absolute;

      pointer-events: none;

      border-radius: 50%;

      border:
        1px solid rgba(65,117,5,.07);

    }


    .decor.one {

      width: 230px;

      height: 230px;

      top: -145px;

      right: -110px;

    }


    .decor.two {

      width: 170px;

      height: 170px;

      bottom: -115px;

      left: -100px;

      background:
        rgba(65,117,5,.025);

    }


    /* BRAND */

    .brand {

      text-align: center;

      position: relative;

      z-index: 2;

    }


    /* MH MONOGRAM */

    .monogram {

      width: 132px;

      height: 132px;

      margin:
        4px auto 19px;

      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

    }


    .monogram::before {

      content: "";

      position: absolute;

      inset: 3px;

      border-radius: 50%;

      border:
        1px solid rgba(65,117,5,.35);

      animation:
        monogramRotate 18s linear infinite;

    }


    .monogram::after {

      content: "";

      position: absolute;

      inset: 13px;

      border-radius: 50%;

      border:
        1px solid rgba(65,117,5,.12);

      animation:
        monogramRotateReverse 12s linear infinite;

    }


    @keyframes monogramRotate {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }


    @keyframes monogramRotateReverse {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(-360deg);
      }

    }


    .monogram-core {

      width: 94px;

      height: 94px;

      border-radius: 50%;

      background:

        linear-gradient(
          145deg,
          #ffffff 10%,
          #f1f5ed 100%
        );

      border:
        2px solid var(--green);

      display: flex;

      justify-content: center;

      align-items: center;

      position: relative;

      z-index: 3;

      color: var(--green);

      font-size: 36px;

      font-weight: 800;

      letter-spacing: 4px;

      padding-left: 4px;

      box-shadow:

        0 13px 35px
        rgba(65,117,5,.14);

    }


    /* NAME */

    .brand-name {

      font-size: 32px;

      line-height: 1.2;

      font-weight: 800;

      letter-spacing: .3px;

      color: var(--green);

    }


    .brand-rule {

      width: 45px;

      height: 2px;

      margin:
        12px auto 13px;

      background: var(--green);

      border-radius: 20px;

    }


    .brand-description {

      font-size: 13.5px;

      line-height: 1.9;

      color: var(--gray);

      margin-bottom: 29px;

    }


    /* ACTIONS */

    .actions {

      position: relative;

      z-index: 2;

      display: flex;

      flex-direction: column;

      gap: 12px;

    }


    .action {

      min-height: 62px;

      width: 100%;

      display: flex;

      align-items: center;

      text-decoration: none;

      border-radius: 18px;

      padding: 7px 9px;

      border: 1px solid transparent;

      cursor: pointer;

      font-family: inherit;

      transition:

        transform .25s ease,

        box-shadow .25s ease,

        border-color .25s ease,

        background .25s ease;

    }


    .action:hover {

      transform:
        translateY(-2px);

    }


    .action:active {

      transform:
        scale(.98);

    }


    /* ACTION ICON */

    .action-icon {

      width: 45px;

      height: 45px;

      min-width: 45px;

      border-radius: 14px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin-left: 12px;

    }


    [dir="ltr"] .action-icon {

      margin-left: 0;

      margin-right: 12px;

    }


    .action-icon svg {

      width: 20px;

      height: 20px;

      stroke: currentColor;

      fill: none;

      stroke-width: 1.7;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    .action-content {

      flex: 1;

      text-align: right;

    }


    [dir="ltr"] .action-content {

      text-align: left;

    }


    .action-title {

      display: block;

      font-size: 15px;

      font-weight: 750;

      line-height: 1.4;

    }


    .action-subtitle {

      display: block;

      font-size: 11px;

      margin-top: 2px;

      opacity: .65;

      font-weight: 400;

    }


    .action-arrow {

      width: 30px;

      height: 30px;

      display: flex;

      align-items: center;

      justify-content: center;

      opacity: .55;

    }


    .action-arrow svg {

      width: 15px;

      height: 15px;

      stroke: currentColor;

      fill: none;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    /* LOCATION */

    .location {

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--green-dark),
          var(--green)
        );

      box-shadow:
        0 12px 27px
        rgba(65,117,5,.22);

    }


    .location:hover {

      box-shadow:
        0 17px 34px
        rgba(65,117,5,.29);

    }


    .location .action-icon {

      background:
        rgba(255,255,255,.13);

      border:
        1px solid
        rgba(255,255,255,.13);

    }


    .location .action-arrow {

      opacity: .8;

    }


    /* REVIEW */

    .review {

      color: var(--green);

      background: white;

      border-color:
        rgba(65,117,5,.15);

      box-shadow:
        0 7px 22px
        rgba(0,0,0,.045);

    }


    .review:hover {

      background: #fbfcfa;

      border-color:
        rgba(65,117,5,.25);

      box-shadow:
        0 11px 28px
        rgba(65,117,5,.09);

    }


    .review .action-icon {

      background:
        var(--green-light);

    }


    /* SHARE */

    .share {

      color: #353535;

      background:
        #f6f8f4;

      border-color:
        rgba(65,117,5,.08);

    }


    .share:hover {

      background:
        #eef3ea;

    }


    .share .action-icon {

      color: var(--green);

      background: white;

    }
    /* =====================================================
       QR SECTION
    ===================================================== */

    .qr-section {

      position: relative;

      z-index: 2;

      margin-top: 31px;

      padding-top: 25px;

      border-top:
        1px solid var(--line);

      text-align: center;

    }


    .qr-heading {

      font-size: 13px;

      color: #62665f;

      margin-bottom: 14px;

    }


    .qr-frame {

      width: 188px;

      height: 188px;

      margin: auto;

      background: white;

      padding: 14px;

      border-radius: 22px;

      border:
        1px solid rgba(65,117,5,.12);

      box-shadow:

        0 12px 30px
        rgba(0,0,0,.065);

      display: flex;

      align-items: center;

      justify-content: center;

    }


    #qrcode {

      width: 160px;

      height: 160px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    #qrcode img,
    #qrcode canvas {

      max-width: 100%;

      max-height: 100%;

    }


    /* =====================================================
       FOOTER
    ===================================================== */

    .footer {

      text-align: center;

      margin-top: 23px;

      color: #a0a49e;

      font-size: 11px;

      position: relative;

      z-index: 2;

    }


    .footer strong {

      color: var(--green);

      font-weight: 700;

    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 390px) {

      body {

        padding:
          12px 9px;

      }


      .card {

        padding:
          29px 17px 25px;

        border-radius: 29px;

      }


      .monogram {

        transform:
          scale(.90);

        margin-bottom: 8px;

      }


      .brand-name {

        font-size: 28px;

      }


      .brand-description {

        margin-bottom: 24px;

      }


      .action {

        min-height: 59px;

      }

    }


    /* =====================================================
       VERY SMALL SCREENS
    ===================================================== */

    @media (max-width: 340px) {

      .action-subtitle {

        display: none;

      }


      .action-icon {

        margin-left: 8px;

      }


      .action-title {

        font-size: 14px;

      }


      .lang-btn {

        padding:
          6px 9px;

        font-size: 10px;

      }

    }


    /* =====================================================
       REDUCE MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      .monogram::before,
      .monogram::after {

        animation: none;

      }

      .card {

        animation: none;

      }

    }

  </style>

</head>


<body>


  <main class="card">


    <div class="accent"></div>

    <div class="decor one"></div>

    <div class="decor two"></div>


    <!-- =================================================
         LANGUAGE SWITCHER
    ================================================== -->

    <div class="language-switcher">

      <button
        class="lang-btn active"
        data-lang="ar"
        onclick="changeLanguage('ar')">

        العربية

      </button>


      <button
        class="lang-btn"
        data-lang="fr"
        onclick="changeLanguage('fr')">

        Français

      </button>


      <button
        class="lang-btn"
        data-lang="en"
        onclick="changeLanguage('en')">

        English

      </button>

    </div>


    <!-- =================================================
         BRAND
    ================================================== -->

    <section class="brand">


      <div class="monogram">

        <div class="monogram-core">
          MH
        </div>

      </div>


      <h1 class="brand-name">
        Top Market
      </h1>


      <div class="brand-rule"></div>


      <p
        class="brand-description"
        id="brandDescription">

        بطاقة رقمية احترافية

        <br>

        وصول سريع إلى Top Market

      </p>


    </section>


    <!-- =================================================
         ACTION BUTTONS
    ================================================== -->

    <section class="actions">


      <!-- GOOGLE MAPS -->

      <a
        class="action location"
        href="https://www.google.com/maps/search/?api=1&query=Top+Market%2C+RES+FERDAOUS%2C+A%C3%AFn+El+Aouda+12100"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="action-icon">

          <svg viewBox="0 0 24 24">

            <path
              d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z">
            </path>

            <circle
              cx="12"
              cy="10"
              r="2.6">
            </circle>

          </svg>

        </span>


        <span class="action-content">

          <span
            class="action-title"
            id="locationTitle">

            موقع Top Market

          </span>


          <span
            class="action-subtitle"
            id="locationSubtitle">

            فتح الموقع على Google Maps

          </span>

        </span>


        <span class="action-arrow">

          <svg viewBox="0 0 24 24">

            <path d="m9 18 6-6-6-6"></path>

          </svg>

        </span>

      </a>


      <!-- GOOGLE REVIEW -->

      <a
        class="action review"
        href="https://g.page/r/CSILOBBl7U49ECE/review"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="action-icon">

          <svg viewBox="0 0 24 24">

            <path
              d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z">
            </path>

          </svg>

        </span>


        <span class="action-content">

          <span
            class="action-title"
            id="reviewTitle">

            قيّمنا على Google

          </span>


          <span
            class="action-subtitle"
            id="reviewSubtitle">

            شاركنا رأيك وتجربتك

          </span>

        </span>


        <span class="action-arrow">

          <svg viewBox="0 0 24 24">

            <path d="m9 18 6-6-6-6"></path>

          </svg>

        </span>

      </a>


      <!-- SHARE -->

      <button
        class="action share"
        onclick="shareCard()"
        type="button"
      >

        <span class="action-icon">

          <svg viewBox="0 0 24 24">

            <circle
              cx="18"
              cy="5"
              r="2.5">
            </circle>

            <circle
              cx="6"
              cy="12"
              r="2.5">
            </circle>

            <circle
              cx="18"
              cy="19"
              r="2.5">
            </circle>

            <path d="m8.2 10.8 7.5-4.3"></path>

            <path d="m8.2 13.2 7.5 4.3"></path>

          </svg>

        </span>


        <span class="action-content">

          <span
            class="action-title"
            id="shareTitle">

            مشاركة البطاقة

          </span>


          <span
            class="action-subtitle"
            id="shareSubtitle">

            أرسل بطاقة Top Market لشخص آخر

          </span>

        </span>


        <span class="action-arrow">

          <svg viewBox="0 0 24 24">

            <path d="m9 18 6-6-6-6"></path>

          </svg>

        </span>

      </button>


    </section>


    <!-- =================================================
         QR
    ================================================== -->

    <section class="qr-section">


      <p
        class="qr-heading"
        id="qrHeading">

        امسح QR Code لفتح البطاقة

      </p>


      <div class="qr-frame">

        <div id="qrcode"></div>

      </div>


    </section>


    <!-- =================================================
         FOOTER
    ================================================== -->

    <footer class="footer">

      <strong>Top Market</strong>

      &nbsp;•&nbsp;

      <span id="footerText">
        Digital Business Card
      </span>

    </footer>


  </main>
  <!-- =====================================================
       QR CODE LIBRARY
  ====================================================== -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


  <script>

    /* =====================================================
       TRANSLATIONS
    ====================================================== */

    const translations = {

      ar: {

        description:
          "بطاقة رقمية احترافية<br>وصول سريع إلى Top Market",

        locationTitle:
          "موقع Top Market",

        locationSubtitle:
          "فتح الموقع على Google Maps",

        reviewTitle:
          "قيّمنا على Google",

        reviewSubtitle:
          "شاركنا رأيك وتجربتك",

        shareTitle:
          "مشاركة البطاقة",

        shareSubtitle:
          "أرسل بطاقة Top Market لشخص آخر",

        qrHeading:
          "امسح QR Code لفتح البطاقة",

        footer:
          "Digital Business Card",

        shareText:
          "Top Market — البطاقة الرقمية",

        copied:
          "تم نسخ رابط البطاقة بنجاح"

      },


      fr: {

        description:
          "Carte numérique professionnelle<br>Accès rapide à Top Market",

        locationTitle:
          "Emplacement Top Market",

        locationSubtitle:
          "Ouvrir l'emplacement sur Google Maps",

        reviewTitle:
          "Évaluez-nous sur Google",

        reviewSubtitle:
          "Partagez votre avis et votre expérience",

        shareTitle:
          "Partager la carte",

        shareSubtitle:
          "Envoyez la carte Top Market à quelqu'un",

        qrHeading:
          "Scannez le QR Code pour ouvrir la carte",

        footer:
          "Carte de visite numérique",

        shareText:
          "Top Market — Carte numérique",

        copied:
          "Le lien de la carte a été copié"

      },


      en: {

        description:
          "Professional digital card<br>Quick access to Top Market",

        locationTitle:
          "Top Market Location",

        locationSubtitle:
          "Open location on Google Maps",

        reviewTitle:
          "Review us on Google",

        reviewSubtitle:
          "Share your opinion and experience",

        shareTitle:
          "Share the Card",

        shareSubtitle:
          "Send the Top Market card to someone",

        qrHeading:
          "Scan the QR Code to open the card",

        footer:
          "Digital Business Card",

        shareText:
          "Top Market — Digital Card",

        copied:
          "Card link copied successfully"

      }

    };


    /* =====================================================
       CURRENT LANGUAGE
    ====================================================== */

    let currentLanguage = "ar";


    /* =====================================================
       CHANGE LANGUAGE
    ====================================================== */

    function changeLanguage(lang) {

      if (!translations[lang]) return;


      currentLanguage = lang;


      const t = translations[lang];


      /* Page language */

      document.documentElement.lang = lang;


      /* Page direction */

      document.documentElement.dir =
        lang === "ar" ? "rtl" : "ltr";


      /* Text */

      document.getElementById(
        "brandDescription"
      ).innerHTML = t.description;


      document.getElementById(
        "locationTitle"
      ).textContent = t.locationTitle;


      document.getElementById(
        "locationSubtitle"
      ).textContent = t.locationSubtitle;


      document.getElementById(
        "reviewTitle"
      ).textContent = t.reviewTitle;


      document.getElementById(
        "reviewSubtitle"
      ).textContent = t.reviewSubtitle;


      document.getElementById(
        "shareTitle"
      ).textContent = t.shareTitle;


      document.getElementById(
        "shareSubtitle"
      ).textContent = t.shareSubtitle;


      document.getElementById(
        "qrHeading"
      ).textContent = t.qrHeading;


      document.getElementById(
        "footerText"
      ).textContent = t.footer;


      /* Active language button */

      document.querySelectorAll(
        ".lang-btn"
      ).forEach(button => {

        button.classList.toggle(
          "active",
          button.dataset.lang === lang
        );

      });

    }


    /* =====================================================
       QR CODE
    ====================================================== */

    const qrContainer =
      document.getElementById("qrcode");


    if (qrContainer && typeof QRCode !== "undefined") {

      new QRCode(qrContainer, {

        text: window.location.href,

        width: 160,

        height: 160,

        colorDark: "#171a16",

        colorLight: "#ffffff",

        correctLevel:
          QRCode.CorrectLevel.H

      });

    }


    /* =====================================================
       SHARE CARD
    ====================================================== */

    async function shareCard() {

      const t =
        translations[currentLanguage];


      const shareData = {

        title: "Top Market",

        text: t.shareText,

        url: window.location.href

      };


      /* Native share */

      if (
        navigator.share &&
        navigator.canShare &&
        navigator.canShare(shareData)
      ) {

        try {

          await navigator.share(shareData);

          return;

        } catch (error) {

          if (error.name === "AbortError") {

            return;

          }

        }

      }


      /* Fallback: copy link */

      try {

        await navigator.clipboard.writeText(
          window.location.href
        );


        alert(t.copied);


      } catch (error) {

        /* Older browsers */

        const temp =
          document.createElement("input");


        temp.value =
          window.location.href;


        document.body.appendChild(temp);


        temp.select();


        document.execCommand("copy");


        temp.remove();


        alert(t.copied);

      }

    }

  </script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./sw.js")
        .then(() => {
          console.log("Top Market: Offline mode enabled");
        })
        .catch(error => {
          console.error("Service Worker error:", error);
        });
    });
  }
</script>
</body>

</html>
