<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Top Market | Digital Business Card</title>

  <meta name="description" content="Top Market - بطاقة رقمية احترافية">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(145deg, #f8faf6, #ffffff);
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px 15px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 28px;
      padding: 35px 25px 28px;
      text-align: center;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.10);
      border: 1px solid rgba(65, 117, 5, 0.12);
      position: relative;
      overflow: hidden;
    }

    .top-line {
      position: absolute;
      top: 0;
      right: 0;
      width: 100%;
      height: 5px;
      background: #417505;
    }

    /* MH Logo */
    .mh-logo {
      width: 105px;
      height: 105px;
      margin: 0 auto 18px;
      border-radius: 50%;
      border: 3px solid #417505;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #417505;
      background: #ffffff;
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 2px;
      box-shadow: 0 8px 25px rgba(65, 117, 5, 0.15);
    }

    h1 {
      color: #417505;
      font-size: 30px;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      width: 100%;
      min-height: 54px;
      border-radius: 15px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 16px;
      font-weight: bold;
      transition: 0.25s ease;
      cursor: pointer;
      border: none;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .location-btn {
      background: #417505;
      color: white;
      box-shadow: 0 7px 18px rgba(65, 117, 5, 0.20);
    }

    .review-btn {
      background: white;
      color: #417505;
      border: 1.5px solid #417505;
    }

    .share-btn {
      background: #f3f6ef;
      color: #417505;
      border: 1px solid rgba(65, 117, 5, 0.15);
    }

    .icon {
      font-size: 20px;
    }

    /* QR */
    .qr-section {
      margin-top: 28px;
      padding-top: 23px;
      border-top: 1px solid #eeeeee;
    }

    .qr-title {
      color: #555;
      font-size: 14px;
      margin-bottom: 13px;
    }

    #qrcode {
      width: 150px;
      height: 150px;
      margin: auto;
      background: white;
      padding: 8px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #qrcode img,
    #qrcode canvas {
      max-width: 100%;
      max-height: 100%;
    }

    .footer {
      margin-top: 22px;
      color: #999;
      font-size: 12px;
    }

    .footer span {
      color: #417505;
      font-weight: bold;
    }

    @media (max-width: 380px) {
      .card {
        padding: 30px 18px 24px;
      }

      .mh-logo {
        width: 92px;
        height: 92px;
        font-size: 34px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="top-line"></div>

    <!-- MH -->
    <div class="mh-logo">MH</div>

    <h1>Top Market</h1>

    <p class="subtitle">
      بطاقة رقمية احترافية
    </p>

    <div class="buttons">

      <!-- Google Maps -->
      <a
        class="btn location-btn"
        href="https://www.google.com/maps/search/?api=1&query=Top+Market%2C+RES+FERDAOUS%2C+A%C3%AFn+El+Aouda+12100"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">📍</span>
        الموقع على Google Maps
      </a>

      <!-- Google Review -->
      <a
        class="btn review-btn"
        href="https://g.page/r/CSILOBBl7U49ECE/review"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="icon">⭐</span>
        قيّمنا على Google
      </a>

      <!-- Share -->
      <button class="btn share-btn" onclick="shareCard()">
        <span class="icon">↗</span>
        مشاركة البطاقة
      </button>

    </div>

    <!-- QR Code -->
    <section class="qr-section">

      <p class="qr-title">
        امسح QR Code لفتح البطاقة
      </p>

      <div id="qrcode"></div>

    </section>

    <div class="footer">
      <span>Top Market</span> · Digital Business Card
    </div>

  </main>


  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script>

    /*
      في الوقت الحالي سيتم إنشاء QR للرابط الحالي للصفحة.
      بعد نشر البطاقة والحصول على الرابط النهائي،
      يمكننا تثبيت الرابط النهائي هنا.
    */

    new QRCode(document.getElementById("qrcode"), {
      text: window.location.href,
      width: 134,
      height: 134,
      colorDark: "#417505",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });


    /* Share */
    async function shareCard() {

      const shareData = {
        title: "Top Market",
        text: "Top Market - البطاقة الرقمية",
        url: window.location.href
      };

      if (navigator.share) {

        try {
          await navigator.share(shareData);
        } catch (error) {
          // المستخدم أغلق نافذة المشاركة
        }

      } else {

        try {

          await navigator.clipboard.writeText(window.location.href);

          alert("تم نسخ رابط البطاقة بنجاح");

        } catch (error) {

          prompt(
            "انسخ رابط البطاقة:",
            window.location.href
          );

        }

      }

    }

  </script>

</body>
</html>
