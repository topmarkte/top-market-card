<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#417505">

  <meta name="description"
        content="Top Market | Digital Business Card">

  <title>Top Market | Digital Card</title>


  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {

      --green: #417505;
      --green-dark: #315904;
      --green-soft: #eef4e8;

      --text: #1d1d1d;
      --muted: #777;

      --border: rgba(65,117,5,0.13);

    }


    body {

      min-height: 100vh;

      font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at 50% -10%,
          #eaf2e3 0,
          #ffffff 40%,
          #f7f9f5 100%
        );

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 25px 15px;

      color: var(--text);

    }


    /* =================================
       MAIN CARD
    ================================= */

    .card {

      width: 100%;

      max-width: 450px;

      background: rgba(255,255,255,.97);

      border:

        1px solid var(--border);

      border-radius: 34px;

      padding:

        38px 25px 30px;

      position: relative;

      overflow: hidden;

      text-align: center;

      box-shadow:

        0 30px 80px rgba(0,0,0,.10),

        0 8px 25px rgba(65,117,5,.07);

      animation:

        cardIn .8s ease;

    }


    @keyframes cardIn {

      from {

        opacity: 0;

        transform:
          translateY(30px)
          scale(.97);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

      }

    }


    /* =================================
       DECORATION
    ================================= */

    .top-line {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 5px;

      background:

        linear-gradient(
          90deg,
          #315904,
          #417505,
          #6d963e,
          #417505,
          #315904
        );

    }


    .decoration-one {

      position: absolute;

      width: 210px;

      height: 210px;

      border-radius: 50%;

      top: -135px;

      right: -110px;

      border:

        1px solid
        rgba(65,117,5,.10);

    }


    .decoration-two {

      position: absolute;

      width: 145px;

      height: 145px;

      border-radius: 50%;

      bottom: -100px;

      left: -70px;

      background:

        rgba(65,117,5,.035);

    }


    /* =================================
       MH BRAND MARK
    ================================= */

    .brand-mark {

      width: 125px;

      height: 125px;

      margin:

        0 auto 20px;

      position: relative;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    .outer-ring {

      position: absolute;

      inset: 0;

      border-radius: 50%;

      border:

        1px solid
        rgba(65,117,5,.32);

      transform:

        rotate(-12deg);

    }


    .outer-ring::after {

      content: "";

      position: absolute;

      inset: 10px;

      border-radius: 50%;

      border:

        1px solid
        rgba(65,117,5,.13);

    }


    .inner-logo {

      width: 94px;

      height: 94px;

      border-radius: 50%;

      background:

        linear-gradient(
          145deg,
          #ffffff,
          #f1f5ed
        );

      border:

        3px solid
        var(--green);

      display: flex;

      align-items: center;

      justify-content: center;

      color: var(--green);

      font-size: 36px;

      font-weight: 800;

      letter-spacing: 4px;

      box-shadow:

        0 12px 30px
        rgba(65,117,5,.15);

      position: relative;

      z-index: 2;

    }


    /* =================================
       BRAND NAME
    ================================= */

    .brand-name {

      font-size: 32px;

      font-weight: 800;

      color: var(--green);

      letter-spacing: .4px;

    }


    .brand-line {

      width: 48px;

      height: 2px;

      margin:

        11px auto 12px;

      background: var(--green);

      border-radius: 20px;

    }


    .brand-description {

      font-size: 13.5px;

      line-height: 1.8;

      color: var(--muted);

      margin-bottom: 29px;

    }


    /* =================================
       BUTTONS
    ================================= */

    .actions {

      display: flex;

      flex-direction: column;

      gap: 13px;

    }


    .action {

      width: 100%;

      min-height: 61px;

      border-radius: 18px;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 12px;

      text-decoration: none;

      font-size: 15.5px;

      font-weight: 700;

      cursor: pointer;

      border: none;

      position: relative;

      overflow: hidden;

      transition:

        transform .25s ease,

        box-shadow .25s ease,

        background .25s ease;

    }


    .action:hover {

      transform:
        translateY(-3px);

    }


    .action:active {

      transform:
        scale(.975);

    }


    /* =================================
       ICON CIRCLE
    ================================= */

    .icon-circle {

      width: 35px;

      height: 35px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

    }


    .icon-circle svg {

      width: 18px;

      height: 18px;

      stroke: currentColor;

      fill: none;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;

    }


    /* =================================
       LOCATION BUTTON
    ================================= */

    .location {

      color: #ffffff;

      background:

        linear-gradient(
          135deg,
          #315904,
          #417505
        );

      box-shadow:

        0 12px 28px
        rgba(65,117,5,.23);

    }


    .location:hover {

      box-shadow:

        0 16px 34px
        rgba(65,117,5,.30);

    }


    .location .icon-circle {

      background:
        rgba(255,255,255,.14);

    }


    /* =================================
       REVIEW BUTTON
    ================================= */

    .review {

      color: var(--green);

      background: #ffffff;

      border:

        1px solid
        rgba(65,117,5,.18);

      box-shadow:

        0 7px 22px
        rgba(0,0,0,.045);

    }


    .review:hover {

      background: #fafcf8;

      box-shadow:

        0 11px 27px
        rgba(65,117,5,.10);

    }


    .review .icon-circle {

      background:

        var(--green-soft);

    }


    /* =================================
       SHARE BUTTON
    ================================= */

    .share {

      color: #333;

      background:

        #f5f7f3;

      border:

        1px solid
        rgba(65,117,5,.09);

    }


    .share:hover {

      background: #edf2e9;

    }


    .share .icon-circle {

      color: var(--green);

      background: #ffffff;

    }


    /* =================================
       QR AREA
    ================================= */

    .qr-section {

      margin-top: 31px;

      padding-top: 26px;

      border-top:

        1px solid #eeeeee;

    }


    .qr-title {

      color: #666;

      font-size: 13px;

      margin-bottom: 15px;

    }


    .qr-wrapper {

      width: 182px;

      height: 182px;

      margin: auto;

      padding: 13px;

      background: white;

      border-radius: 20px;

      border:

        1px solid
        rgba(65,117,5,.12);

      box-shadow:

        0 10px 28px
        rgba(0,0,0,.065);

      display: flex;

      align-items: center;

      justify-content: center;

    }


    #qrcode {

      width: 154px;

      height: 154px;

      display: flex;

      align-items: center;

      justify-content: center;

    }


    #qrcode img,
    #qrcode canvas {

      max-width: 100%;

      max-height: 100%;

    }


    /* =================================
       FOOTER
    ================================= */

    .footer {

      margin-top: 24px;

      color: #a0a0a0;

      font-size: 11.5px;

    }


    .footer strong {

      color: var(--green);

    }


    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 390px) {

      body {

        padding: 15px 10px;

      }


      .card {

        padding:

          32px 18px 25px;

        border-radius: 28px;

      }


      .brand-mark {

        transform: scale(.92);

        margin-bottom: 12px;

      }


      .brand-name {

        font-size: 28px;

      }


      .action {

        min-height: 57px;

        font-size: 15px;

      }

    }

  </style>

</head>


<body>


  <main class="card">


    <div class="top-line"></div>

    <div class="decoration-one"></div>

    <div class="decoration-two"></div>


    <!-- =========================
         MH LOGO
    ========================== -->

    <div class="brand-mark">

      <div class="outer-ring"></div>

      <div class="inner-logo">
        MH
      </div>

    </div>


    <!-- =========================
         BRAND
    ========================== -->

    <h1 class="brand-name">
      Top Market
    </h1>


    <div class="brand-line"></div>


    <p class="brand-description">

      بطاقة رقمية احترافية

      <br>

      للوصول السريع إلى Top Market

    </p>


    <!-- =========================
         ACTIONS
    ========================== -->

    <div class="actions">


      <!-- LOCATION -->

      <a
        class="action location"
        href="https://www.google.com/maps/search/?api=1&query=Top+Market%2C+RES+FERDAOUS%2C+A%C3%AFn+El+Aouda+12100"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icon-circle">

          <svg viewBox="0 0 24 24">

            <path
              d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z">
            </path>

            <circle
              cx="12"
              cy="10"
              r="2.5">
            </circle>

          </svg>

        </span>

        <span>
          موقع Top Market
        </span>

      </a>


      <!-- GOOGLE REVIEW -->

      <a
        class="action review"
        href="https://g.page/r/CSILOBBl7U49ECE/review"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="icon-circle">

          <svg viewBox="0 0 24 24">

            <path
              d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3Z">
            </path>

          </svg>

        </span>

        <span>
          قيّمنا على Google
        </span>

      </a>


      <!-- SHARE -->

      <button
        class="action share"
        onclick="shareCard()"
      >

        <span class="icon-circle">

          <svg viewBox="0 0 24 24">

            <circle
              cx="18"
              cy="5"
              r="2.5">
            </circle>

            <circle
              cx="6"
              cy="12"
              r="2.5">
            </circle>

            <circle
              cx="18"
              cy="19"
              r="2.5">
            </circle>

            <path
              d="m8.2 10.8 7.5-4.3">
            </path>

            <path
              d="m8.2 13.2 7.5 4.3">
            </path>

          </svg>

        </span>

        <span>
          مشاركة البطاقة
        </span>

      </button>


    </div>


    <!-- =========================
         QR CODE
    ========================== -->

    <section class="qr-section">

      <p class="qr-title">
        امسح الرمز لفتح البطاقة
      </p>


      <div class="qr-wrapper">

        <div id="qrcode"></div>

      </div>

    </section>


    <!-- =========================
         FOOTER
    ========================== -->

    <div class="footer">

      <strong>Top Market</strong>

      &nbsp;•&nbsp;

      Digital Business Card

    </div>


  </main>


  <!-- QR CODE LIBRARY -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  </script>


  <script>


    /* =========================
       QR CODE
    ========================= */

    new QRCode(

      document.getElementById("qrcode"),

      {

        text:
          window.location.href,

        width:
          154,

        height:
          154,

        colorDark:
          "#417505",

        colorLight:
          "#ffffff",

        correctLevel:
          QRCode.CorrectLevel.H

      }

    );


    /* =========================
       SHARE
    ========================= */

    async function shareCard() {


      const shareData = {

        title:
          "Top Market",

        text:
          "Top Market - البطاقة الرقمية",

        url:
          window.location.href

      };


      if (navigator.share) {


        try {

          await navigator.share(
            shareData
          );

        }

        catch (error) {

          // تم إغلاق نافذة المشاركة

        }


      }

      else {


        try {

          await navigator.clipboard.writeText(
            window.location.href
          );

          alert(
            "تم نسخ رابط البطاقة بنجاح"
          );

        }

        catch (error) {

          prompt(
            "انسخ رابط البطاقة:",
            window.location.href
          );

        }

      }

    }

  </script>


</body>

</html>
