<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#417505">

  <meta name="description"
        content="Top Market | بطاقة رقمية احترافية">

  <title>Top Market | Digital Card</title>

  <style>

    /* =========================
       GENERAL
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --green: #417505;
      --dark-green: #315904;
      --light-green: #eef4e8;
      --text: #202020;
      --muted: #777;
      --white: #ffffff;
    }

    body {
      min-height: 100vh;

      font-family:
        "Segoe UI",
        Tahoma,
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at 50% 0%,
          #eef5e8 0%,
          #ffffff 38%,
          #f7f9f5 100%
        );

      color: var(--text);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 25px 15px;

      overflow-x: hidden;
    }


    /* =========================
       CARD
    ========================= */

    .card {

      width: 100%;
      max-width: 440px;

      background: rgba(255,255,255,0.97);

      border: 1px solid rgba(65,117,5,0.12);

      border-radius: 32px;

      padding: 34px 24px 28px;

      text-align: center;

      box-shadow:
        0 25px 70px rgba(0,0,0,0.10),
        0 5px 18px rgba(65,117,5,0.07);

      position: relative;

      overflow: hidden;

      animation:
        cardAppear 0.8s ease forwards;
    }

    @keyframes cardAppear {

      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }

    }


    /* Decorative top */

    .top-decoration {

      position: absolute;

      top: -90px;
      right: -70px;

      width: 210px;
      height: 210px;

      border-radius: 50%;

      background:
        rgba(65,117,5,0.06);
    }


    .top-line {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 5px;

      background:
        linear-gradient(
          90deg,
          #315904,
          #417505,
          #668f35,
          #417505,
          #315904
        );
    }


    /* =========================
       MH LOGO
    ========================= */

    .logo-area {

      position: relative;

      width: 118px;
      height: 118px;

      margin: 4px auto 20px;

      display: flex;

      justify-content: center;
      align-items: center;
    }


    .logo-ring {

      position: absolute;

      width: 118px;
      height: 118px;

      border-radius: 50%;

      border:
        1px solid rgba(65,117,5,0.35);

      transform: rotate(-12deg);
    }


    .logo-ring::before {

      content: "";

      position: absolute;

      width: 82px;
      height: 82px;

      border-radius: 50%;

      border:
        1px solid rgba(65,117,5,0.20);

      top: 17px;
      left: 17px;
    }


    .mh-logo {

      width: 91px;
      height: 91px;

      border-radius: 50%;

      background:
        linear-gradient(
          145deg,
          #ffffff,
          #f2f6ee
        );

      border:
        3px solid var(--green);

      display: flex;

      align-items: center;
      justify-content: center;

      color: var(--green);

      font-size: 36px;

      font-weight: 800;

      letter-spacing: 3px;

      box-shadow:
        0 10px 28px rgba(65,117,5,0.16);

      position: relative;

      z-index: 2;
    }


    /* =========================
       NAME
    ========================= */

    .brand-name {

      font-size: 31px;

      font-weight: 800;

      letter-spacing: 0.5px;

      color: var(--green);

      margin-bottom: 7px;
    }


    .brand-line {

      width: 45px;
      height: 2px;

      background: var(--green);

      margin: 0 auto 12px;

      border-radius: 10px;
    }


    .subtitle {

      color: var(--muted);

      font-size: 14px;

      line-height: 1.8;

      margin-bottom: 27px;
    }


    /* =========================
       BUTTONS
    ========================= */

    .buttons {

      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    .btn {

      width: 100%;

      min-height: 58px;

      border-radius: 17px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 11px;

      text-decoration: none;

      font-size: 15.5px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;

      position: relative;

      overflow: hidden;
    }


    .btn::after {

      content: "";

      position: absolute;

      top: 0;
      left: -100%;

      width: 70%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.25),
          transparent
        );

      transform: skewX(-20deg);

      transition: 0.6s;
    }


    .btn:hover::after {

      left: 130%;
    }


    .btn:hover {

      transform: translateY(-3px);
    }


    .btn:active {

      transform: scale(0.97);
    }


    .btn-icon {

      width: 29px;
      height: 29px;

      border-radius: 50%;

      display: flex;

      justify-content: center;
      align-items: center;

      font-size: 16px;
    }


    /* Location */

    .location-btn {

      color: white;

      background:
        linear-gradient(
          135deg,
          #315904,
          #417505
        );

      box-shadow:
        0 10px 25px rgba(65,117,5,0.24);
    }


    .location-btn:hover {

      box-shadow:
        0 14px 30px rgba(65,117,5,0.32);
    }


    .location-btn .btn-icon {

      background:
        rgba(255,255,255,0.16);
    }


    /* Review */

    .review-btn {

      color: var(--green);

      background: #ffffff;

      border:
        1px solid rgba(65,117,5,0.22);

      box-shadow:
        0 6px 18px rgba(0,0,0,0.04);
    }


    .review-btn:hover {

      background: #fafcf8;

      box-shadow:
        0 9px 22px rgba(65,117,5,0.10);
    }


    .review-btn .btn-icon {

      background: #f5f7f1;
    }


    /* Share */

    .share-btn {

      color: #3d3d3d;

      background:
        #f5f7f3;

      border:
        1px solid rgba(65,117,5,0.10);
    }


    .share-btn:hover {

      background: #edf2e9;
    }


    .share-btn .btn-icon {

      background: white;

      color: var(--green);
    }


    /* =========================
       QR SECTION
    ========================= */

    .qr-section {

      margin-top: 30px;

      padding-top: 25px;

      border-top:
        1px solid #eeeeee;
    }


    .qr-label {

      font-size: 13px;

      color: #666;

      margin-bottom: 14px;
    }


    .qr-box {

      width: 175px;
      height: 175px;

      margin: auto;

      background: white;

      border-radius: 19px;

      padding: 12px;

      display: flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid rgba(65,117,5,0.12);

      box-shadow:
        0 8px 25px rgba(0,0,0,0.07);
    }


    #qrcode {

      width: 151px;
      height: 151px;

      display: flex;

      align-items: center;
      justify-content: center;
    }


    #qrcode img,
    #qrcode canvas {

      max-width: 100%;
      max-height: 100%;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      margin-top: 24px;

      font-size: 11.5px;

      color: #999;

      letter-spacing: 0.2px;
    }


    .footer strong {

      color: var(--green);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 390px) {

      body {

        padding: 15px 10px;
      }


      .card {

        padding:
          30px 18px 24px;

        border-radius: 27px;
      }


      .logo-area {

        transform: scale(0.92);

        margin-bottom: 13px;
      }


      .brand-name {

        font-size: 28px;
      }


      .btn {

        min-height: 55px;

        font-size: 15px;
      }

    }

  </style>
</head>


<body>

  <main class="card">

    <div class="top-line"></div>

    <div class="top-decoration"></div>


    <!-- =====================
         MH LOGO
    ====================== -->

    <div class="logo-area">

      <div class="logo-ring"></div>

      <div class="mh-logo">
        MH
      </div>

    </div>


    <!-- =====================
         BRAND
    ====================== -->

    <h1 class="brand-name">
      Top Market
    </h1>

    <div class="brand-line"></div>

    <p class="subtitle">
      بطاقة رقمية احترافية
      <br>
      للوصول السريع إلى Top Market
    </p>


    <!-- =====================
         BUTTONS
    ====================== -->

    <div class="buttons">


      <!-- GOOGLE MAPS -->

      <a
        class="btn location-btn"
        href="https://www.google.com/maps/search/?api=1&query=Top+Market%2C+RES+FERDAOUS%2C+A%C3%AFn+El+Aouda+12100"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="btn-icon">
          📍
        </span>

        <span>
          موقع Top Market
        </span>

      </a>


      <!-- GOOGLE REVIEW -->

      <a
        class="btn review-btn"
        href="https://g.page/r/CSILOBBl7U49ECE/review"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="btn-icon">
          ⭐
        </span>

        <span>
          قيّمنا على Google
        </span>

      </a>


      <!-- SHARE -->

      <button
        class="btn share-btn"
        onclick="shareCard()"
      >

        <span class="btn-icon">
          ↗
        </span>

        <span>
          مشاركة البطاقة
        </span>

      </button>

    </div>


    <!-- =====================
         QR
    ====================== -->

    <section class="qr-section">

      <p class="qr-label">
        امسح الرمز لفتح البطاقة
      </p>

      <div class="qr-box">

        <div id="qrcode"></div>

      </div>

    </section>


    <!-- =====================
         FOOTER
    ====================== -->

    <div class="footer">

      <strong>Top Market</strong>

      &nbsp;•&nbsp;

      Digital Business Card

    </div>

  </main>


  <!-- QR CODE LIBRARY -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
  </script>


  <script>

    /* =========================
       QR CODE
    ========================= */

    new QRCode(
      document.getElementById("qrcode"),
      {
        text: window.location.href,

        width: 151,
        height: 151,

        colorDark: "#417505",

        colorLight: "#ffffff",

        correctLevel:
          QRCode.CorrectLevel.H
      }
    );


    /* =========================
       SHARE
    ========================= */

    async function shareCard() {

      const shareData = {

        title: "Top Market",

        text:
          "Top Market - البطاقة الرقمية",

        url:
          window.location.href
      };


      if (navigator.share) {

        try {

          await navigator.share(
            shareData
          );

        } catch (error) {

          // تم إغلاق نافذة المشاركة

        }

      } else {

        try {

          await navigator.clipboard.writeText(
            window.location.href
          );

          alert(
            "تم نسخ رابط البطاقة بنجاح"
          );

        } catch (error) {

          prompt(
            "انسخ رابط البطاقة:",
            window.location.href
          );

        }

      }

    }

  </script>

</body>
</html>
